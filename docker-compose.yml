services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: finora
      POSTGRES_USER: finora
      POSTGRES_PASSWORD: finora
    ports:
      # 127.0.0.1, not the bare "5432:5432" this used to be. Docker publishes a bare mapping on
      # 0.0.0.0, so the previous form put a database holding whatever statements were used for
      # testing on every interface of the machine, reachable with the finora/finora credentials
      # three lines above -- on café wifi, a conference network, or any office LAN. Nothing here
      # needs that: the backend container reaches Postgres over the compose network by service
      # name (DB_HOST: postgres below), which does not involve a published port at all. This
      # mapping exists purely so psql/DataGrip on the host can connect, and the host is where
      # 127.0.0.1 already reaches.
      - "127.0.0.1:5432:5432"
    volumes:
      - finora_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finora"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: finora
      DB_USER: finora
      DB_PASSWORD: finora
      # Override this with a real random 32+ char value in production - never reuse this default.
      JWT_SECRET: local-dev-secret-change-me-before-any-real-deployment
      # Both frontends run natively against this container (see Priority 3 of the engineering
      # directive) -- the user app on 5173 (frontend/) and the admin portal on 5174
      # (admin-portal/), each its own Vite dev server, each proxying /api to this backend.
      CORS_ORIGINS: http://localhost:5173,http://localhost:5174
      # Phone verification (registration, password reset, authenticated password change) needs the
      # Firebase Admin SDK -- see FirebaseConfig. Point at a service-account JSON key inside the
      # .finora bind mount below, which is already gitignored: this file is a real secret and must
      # never be committed. Get it from Firebase Console -> Project Settings -> Service Accounts ->
      # Generate new private key, and save it as ./.finora/firebase-service-account.json.
      #
      # Safe to set before the file exists: FirebaseConfig catches the read failure, logs a warning
      # and registers no bean, so the dev stack still boots -- only phone verification fails (503),
      # exactly as it does today with this unset. Only the `prod` profile refuses to start without
      # it (ProductionConfigValidator).
      GOOGLE_APPLICATION_CREDENTIALS: /app/.finora/firebase-service-account.json
    ports:
      # Deliberately NOT narrowed to 127.0.0.1 the way postgres above was, and the asymmetry is
      # the point. docs/engineering/mobile-setup.md tells you to point a real device at this port
      # over your LAN IP (EXPO_PUBLIC_API_BASE_URL=http://192.168.1.42:8080), and the Android
      # emulator reaches it via 10.0.2.2 -- both need a non-loopback bind. Postgres has no
      # equivalent caller, which is what made it a free fix and this one a trade.
      #
      # So this port stays exposed, and it is exposed running the dev profile: Swagger is
      # anonymous and forgotPassword returns live reset links in the response body. Treat the dev
      # stack as untrusted on an untrusted network regardless of what is bound where.
      - "8080:8080"
    volumes:
      # BootstrapService (V33__bootstrap_admin.sql / SetupService) writes the one-time
      # installation key to .finora/installation.key on first startup. A bind mount, not a named volume
      # -- the whole point is that this file needs to be directly readable from the host project
      # directory (see .gitignore), not something you'd need `docker compose exec` to inspect.
      - ./.finora:/app/.finora
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  finora_pgdata:
