# Provisioned so the stack is usable the moment it starts, and so what is validated locally is the
# same configuration a production Grafana would import.
apiVersion: 1
datasources:
  - name: Prometheus
    # Both dashboards hard-code datasource.uid: "prometheus" (Grafana's own convention for a
    # provisioned datasource referenced from dashboard JSON). Without this, Grafana assigns a
    # random uid on provisioning and every panel fails with "Datasource prometheus was not found" —
    # a real, previously-unverified bug caught only by actually running this stack end to end.
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
