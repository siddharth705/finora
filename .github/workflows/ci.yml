name: CI

# The README has claimed this file existed since the "Architecture hardening, round 2" section,
# but it was never actually committed -- every push and PR has been unverified until now. Each job
# below was run locally against this exact tree before being written here, so the pipeline starts
# green rather than needing to be debugged in CI.
# `push` is main-only, deliberately narrower than the `['**']` it used to be.
#
# Triggering on every branch push AND on pull_request produced TWO full runs for every PR update,
# and the `concurrency` group below cannot collapse them: it keys on github.ref, which differs
# between the two events (refs/heads/<branch> vs refs/pull/<n>/merge), so each run only ever
# cancels its own kind. On GitHub-hosted runners that was invisible waste. On one self-hosted
# runner it is the throughput ceiling: five jobs per run, serialised, doubled. A single round of
# dependabot updates put ten runs and roughly fifty jobs into a queue one machine had to drain.
#
# The trade is real and worth stating: a push to a branch with no open PR now gets no CI. Open the
# PR (draft is fine) and it runs. That is the point at which the result is worth a runner slot.
#
# workflow_dispatch is here so the runner can be health-checked without inventing a commit --
# `gh workflow run ci.yml --ref main`. See docs/infrastructure/self-hosted-runner.md.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch makes the in-flight run obsolete. Cancelling it keeps queue times
# down on a shared runner allowance -- but never for main, where every commit's result is a record
# worth keeping rather than something to discard when the next one lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least privilege for GITHUB_TOKEN, stated rather than inherited.
#
# With no `permissions:` block at all, the token gets whatever the repository's default workflow
# permissions happen to be -- a REPOSITORY SETTING, not a property of this file. On an older repo,
# or one whose org default was never changed, that default is read/write on everything: contents,
# packages, deployments, issues, pull requests. Nothing here needs any of it, and a workflow that
# runs untrusted-ish input (dependabot branches, and any future fork PR) should not be holding a
# token that can push to main.
#
# `contents: read` is what the jobs actually use: actions/checkout reads the repo, and that is the
# only GITHUB_TOKEN consumer in the file. Deliberately NOT narrower-per-job -- one top-level
# declaration cannot be forgotten when a sixth job is added, whereas per-job blocks silently omit
# the new one and it inherits the default again.
#
# Note what this does NOT break: actions/upload-artifact authenticates with the Actions runtime
# token (ACTIONS_RUNTIME_TOKEN), which is issued separately and is unaffected by this block. The
# three upload steps keep working. If a future step needs to comment on a PR or cut a release, give
# THAT job its own wider `permissions:` rather than widening this one.
permissions:
  contents: read

# Every job below runs on a SELF-HOSTED macOS (Apple Silicon) runner rather than ubuntu-latest.
#
# Why: GitHub-hosted runners stopped starting entirely ("The job was not started because recent
# account payments have failed or your spending limit needs to be increased"), which is not a
# failure any workflow change can fix and which blocked every push and PR. Self-hosting removes CI
# from that dependency.
#
# macOS because that is the runner that exists. A Linux runner would have been the smaller diff,
# since it keeps the two things below working untouched, but it needs a Linux host and there isn't
# one. Two porting changes were required to leave ubuntu-latest, and both are noted at their call
# sites so they are not mistaken for style:
#
#   * The `smoke` job's Postgres. It was a `services:` container, and service containers are a
#     Linux-container feature that does not run on a macOS runner at all. It is now an explicit
#     `docker run` with its own readiness wait and an always-run teardown.
#   * `playwright install --with-deps`. The --with-deps flag shells out to apt-get and has no macOS
#     path, so it is dropped; browser dependencies come from the OS instead.
#
# The label list is [self-hosted, macOS, ARM64] rather than bare `self-hosted`, which would match
# ANY self-hosted runner: the day a second one joins on a different OS or architecture it could
# otherwise silently claim these jobs and fail in ways that look like product breakage.
#
# WHAT THE RUNNER HOST MUST PROVIDE. These are assumptions ubuntu-latest satisfied for free, and a
# self-hosted Mac does not:
#
#   * Docker Desktop, RUNNING. Needed twice over: Testcontainers in the `backend` job, and the
#     Postgres container in `smoke`. This is the one that will bite, because it is a desktop app
#     rather than a daemon: a reboot, a logout, or a laptop that slept through the night leaves
#     Docker down, and both jobs then fail at container startup rather than on an assertion.
#   * python3, for the thirteen guard scripts. macOS has shipped it for years, but note those steps
#     invoke `python3` and NOT `python`: macOS removed the bare `python` command in 12.3, and a
#     bare Ubuntu has not had it since 20.04 either, so `python3` is the only spelling that works
#     on the hosted image, this Mac, and any future Linux runner alike.
#   * Enough disk for a full checkout plus ~/.m2 and node_modules across five jobs.
#
# Java and Node are NOT in that list: actions/setup-java and actions/setup-node install them per
# job, exactly as on a hosted runner, and Temurin publishes ARM64 macOS builds.
#
# OPERATIONAL NOTES, worth knowing before the first run.
#
#   * A single runner executes ONE job at a time, so these five jobs stop being parallel and
#     serialise instead. Nothing fails, but wall-clock for a full run becomes roughly the sum
#     rather than the slowest, and `timeout-minutes` counts only a job's own execution, not time
#     spent queued. Register more runners if that matters.
#   * The workspace is REUSED between runs rather than being a fresh VM. actions/checkout cleans it
#     (`git clean -ffdx`) so tracked state is fine, but anything living outside the workspace --
#     ~/.m2, Docker containers, stray processes on the app ports -- survives. That is why the
#     Postgres step force-removes any container left by a previous run before starting a new one.
#
# If the billing block is lifted and hosted runners are wanted back, the revert is these five
# `runs-on` values plus restoring the `services:` block; keep the python3 spelling either way.
jobs:
  backend:
    # No test count in the name: it was "934" while the suite was already at 936, because a
    # hardcoded total goes stale on the very next commit that adds a test and nothing fails when
    # it does. The job reports its own real count in the run output.
    name: Backend (Java 25)
    runs-on: [self-hosted, macOS, ARM64]
    # Without this a job runs to GitHub's 6-hour default. The realistic way to hit that is not a
    # slow test but a stuck one: this job starts Testcontainers, and a container that never becomes
    # healthy leaves the suite waiting rather than failing. Six hours of runner allowance is the
    # smaller cost -- `concurrency` deliberately does not cancel runs on main, so every later push
    # queues behind the hung one and main stops reporting at all.
    #
    # 20 is roughly 8x the current 2m37s, so it is a hang detector, not a performance budget: it
    # should never fire because the suite got slower.
    timeout-minutes: 20
    steps:
      # fetch-depth: 0 because the PII check diffs a commit RANGE here rather than the index (see
      # its --range flag). A shallow checkout would not have the base commit, and the script would
      # fall back to scanning nothing -- passing vacuously, which reads as coverage in review.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # check-dashboard-metrics.py imports PyYAML and nothing ever installed it. That worked by
      # accident twice over -- the ubuntu-latest image ships PyYAML, and this Mac's SYSTEM python3
      # happened to have a user-installed copy -- until an unrelated `brew install` pulled in a
      # newer Python that took first place on PATH, and the guard started failing with
      # ModuleNotFoundError on a commit that had not touched it. A hosted runner hides that by
      # rebuilding its image every run; a machine that persists does not.
      #
      # A venv rather than actions/setup-python, which was tried first and FAILS on this runner:
      # setup-python resolves a version from the runner tool cache or downloads one, and there is
      # no macOS/arm64 build for it to use -- _work/_tool/ has Java and node in it and no Python at
      # all. A venv needs nothing but the python3 already on the box.
      #
      # This pins the PACKAGES, not the interpreter version, and the packages were the actual
      # problem. GITHUB_PATH puts the venv first for every later step, so `python3 scripts/...`
      # below resolves here rather than to whatever PATH happens to offer.
      - name: Python guard-script dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/guard-venv"
          "$RUNNER_TEMP/guard-venv/bin/pip" install -q -r scripts/requirements.txt
          echo "$RUNNER_TEMP/guard-venv/bin" >> "$GITHUB_PATH"

      # scripts/check-xml-comments.py exists because exactly this broke backend/pom.xml once --
      # an internal "--" inside an XML comment, which Maven's POM parser rejects outright with an
      # error that doesn't obviously point at the comment. It used to be a script nobody ran
      # automatically (no exit code on failure, not wired into CI or pre-commit, "python3
      # scripts/check-xml-comments.py" only ever in its own usage docstring) -- exactly the shape
      # that let the original incident happen, so catching it here rather than at `mvn` parse time
      # is the actual fix, not the script's mere existence.
      # The customer-PII guard. It was pre-commit-only, and that is three kinds of absent: it can
      # be skipped with --no-verify (a pressure its own header acknowledges), it is not installed
      # on a fresh clone unless someone runs `npm install` at the ROOT (hooks come from the root
      # package.json's "prepare": "husky", so anyone working only in backend/ has none), and
      # nothing on the server side ever looked.
      #
      # It is the sole automated control against recurrence of a real, still-open incident:
      # docs/engineering/incidents/2026-08-03-customer-pii-in-git-history.md, a customer's name and
      # 14-digit account number committed in a source comment, status "Open -- remediation
      # DEFERRED." This repository has already written down the principle, about a different
      # script, in this same file: "a script nobody ran automatically... exactly the shape that let
      # the original incident happen."
      #
      # fetch-depth 0 and an explicit range because the hook diffs the INDEX, which does not exist
      # on a CI checkout -- see the script's --range flag.
      - name: Customer PII check
        run: sh scripts/check-fixture-hygiene.sh --range "${{ github.event.pull_request.base.sha || github.event.before }}" "${{ github.sha }}"

      # Same absence, same fix. Its own comment records the shipped production bug it exists to
      # prevent -- "a 401-handling fix landed on web, missed mobile, and shipped a bug where a
      # mistyped password revoked every session on every device" -- and a guard against a bug that
      # already shipped once should not be skippable.
      - name: Client auth policy
        run: python3 scripts/check-client-auth-policy.py

      - name: XML comment check
        run: python3 scripts/check-xml-comments.py

      # Runs before setup-java so the diagnosis arrives before the step that would fail on it.
      # ./mvnw was committed non-executable and every backend run died here with a bare
      # "Permission denied" / exit 126 -- accurate, but it names a temp shell script rather than
      # the committed mode, which is why it went unread for the workflow's whole life.
      - name: Executable bits
        run: python3 scripts/check-executable-bits.py

      # A Grafana panel querying a metric that does not exist renders an empty graph, and an alert
      # on a non-existent series never fires -- both indistinguishable from a healthy system. The
      # translation is easy to get wrong because Micrometer renames on the way out: dots become
      # underscores, counters gain _total, timers expand into _seconds_bucket/_count/_sum.
      - name: Dashboard metrics
        run: python3 scripts/check-dashboard-metrics.py

      # Also before setup-java, and for the same reason: it names the file and the type, where
      # javac names a symbol at a line in whatever compiled first. Cheap enough (~0.4s over 476
      # files) that running it ahead of a 5-minute build is free.
      #
      # --self-test first, because this checker CAN be silently vacuous -- a tokeniser that
      # matches nothing passes every run and looks identical to a clean tree. The self-test asserts
      # it still detects a genuinely missing import, and still does NOT fire on the four patterns
      # that produced its historical false positives.
      - name: Import cross-reference (self-test)
        run: python3 scripts/check-imports.py --self-test

      - name: Import cross-reference
        run: python3 scripts/check-imports.py

      # corpus-diff.py is the regression gate for parser changes, and CI can never exercise it on
      # real data: the corpus is real customer statements and lives outside the working tree by
      # policy. So its logic is tested against synthetic records instead, which is the only way this
      # gate gets tested at all. One of these tests also asserts the script names no bank and no
      # corpus filename (ADR-004) -- a diff tool that knows what each file "should" produce is the
      # assumption we are deliberately not building.
      - name: Corpus diff (self-test)
        run: python3 scripts/test-corpus-diff.py

      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          # Keys off pom.xml, so a dependency change busts it and nothing else does.
          cache: 'maven'

      # No explicit Docker setup step: the suite's Testcontainers integration tests need a Docker
      # daemon. On ubuntu-latest one was always running; on the self-hosted runner this is now a
      # provisioning requirement on the host rather than something the image guarantees, which is
      # why it is listed at the top of this file. If it is missing, every *IT class fails at
      # container startup rather than on an assertion.
      #
      # This claim used to be false. The 29 *IT classes never ran: surefire's default includes
      # don't match *IT.java (that's maven-failsafe's convention) and failsafe was never
      # configured, so the "Testcontainers tests" this comment promised had never executed once.
      # backend/pom.xml now widens surefire's includes, and the suite really does run them --
      # 1055 tests instead of 941, verified locally against a real daemon.
      #
      # That claim is no longer trust-me: the Test summary step below publishes the unit/IT split
      # to the run page and fails if the IT count is ever zero again.
      - name: Run tests
        working-directory: backend
        run: ./mvnw -B --no-transfer-progress test

      # Runs on a FAILING run too -- that is when knowing which classes failed, and whether the ITs
      # ran at all, is worth most. It reports rather than re-judges: a genuine test failure is
      # already the previous step's exit code, and this only adds a failure of its own for a hollow
      # result (no reports, 0 tests, or 0 *IT).
      #
      # `!cancelled()` rather than `always()`, which was the original and included the CANCELLED
      # case. See the Guardian step below for the incident that changed it.
      - name: Test summary
        if: ${{ !cancelled() }}
        run: python3 scripts/summarize-surefire.py

      # guardian-report.py was the last checker referenced only in documentation -- never in CI,
      # a hook, or a package script. That is precisely the anti-pattern the XML-comment step above
      # already records this repository diagnosing once, and it was left standing next to it.
      #
      # It joins GuardianRegistryTest's generated rule manifest against the surefire results, so it
      # needs the test step to have run and adds no work of its own. It runs on a failing run for
      # the same reason the summary does: knowing WHICH guardian rules broke is worth most then. It
      # reports rather than re-judges -- a failed rule is already the test step's exit code -- but
      # it exits non-zero on a report it could not produce, so a manifest that stops being generated
      # is a failure rather than silence.
      #
      # `!cancelled()` rather than `always()`. `always()` also covers CANCELLATION, and cancellation
      # is ROUTINE here: `concurrency.cancel-in-progress` kills the in-flight run on every push to a
      # branch that already has one. The test step dies mid-suite, no target/guardian-rules.json is
      # ever written, and this step then runs anyway and exits 2 with
      #
      #   Repository Guardian: no rule manifest found.
      #
      # -- which reads exactly like a broken architecture rule and is nothing of the sort. Observed
      # on run 31245844373: "Run tests" cancelled, this step failure, every other step green.
      #
      # That is the failure mode this repository keeps writing down about its own checks: a red
      # signal produced by routine activity is one people learn to scroll past, and the next real
      # Guardian failure arrives into a stream nobody reads. The step's whole purpose is to make a
      # broken rule visible.
      #
      # Deliberately NOT applied to the two teardown steps further down, which keep `always()`. A
      # cancelled run is exactly when a leftover Postgres container or a backgrounded jar most needs
      # killing -- there, covering cancellation is the point.
      - name: Repository Guardian report
        if: ${{ !cancelled() }}
        run: python3 scripts/guardian-report.py

      # The XML behind the summary, for reading a stack trace without re-running the suite.
      # Failures only: on a green run nobody opens it, and it is ~2MB of XML per run.
      - name: Upload surefire reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 14

  frontend:
    name: User frontend
    runs-on: [self-hosted, macOS, ARM64]
    # See the backend job for why. Shorter budget: no containers here, ~1m40s today.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7


      - uses: actions/setup-node@v7
        with:
          # Matches the engines field in frontend/package.json (">=20.19.0").
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` (not `npm install`) so the lockfile is authoritative and CI can't silently
      # resolve a different dependency tree than a developer machine.
      - name: Install
        working-directory: frontend
        run: npm ci

      # `npm run lint` existed in package.json from the day eslint.config.js was written, but this
      # workflow never ran it -- a lint script nobody runs is indistinguishable from no lint script,
      # except that it looks like coverage in review. It runs with --max-warnings 0: the config's
      # own comments explain that its rules are chosen as bug diagnostics rather than style, so a
      # warning here is a finding, and warnings that never fail anything just accumulate.
      - name: Lint
        working-directory: frontend
        run: npm run lint

      # Runs from the repo root, not frontend/, because it scans all three apps: a dead support
      # address is equally broken in admin-portal or mobile, and the whole point is that no copy of
      # it escapes. Cheap and dependency-free, so it sits with lint rather than behind the tests.
      - name: Contact addresses
        run: python3 scripts/check-contact-addresses.py

      # Runs from the repo root and scans web AND mobile: the dashboard's monthly figures are the
      # newest month with DATA, not necessarily the current one, and a client that labels them
      # "this month" makes the number wrong silently. The server-side half of that fix landed with
      # the web client and mobile kept three hardcoded claims -- the same web-fixed/mobile-missed
      # drift check-client-auth-policy.py exists for, one layer up.
      - name: Reporting period labels
        run: python3 scripts/check-reporting-period-labels.py

      # `npm audit` in this repo has never been empty -- 18 vulnerability entries across the three
      # JS apps, every one already judged not to apply. That is exactly how a real advisory gets
      # missed: a command whose output is always non-empty is one people learn to skip, and the
      # open redirect fixed in 1ea5d13 sat in that noise. This check leaves no third state: an
      # advisory in shipped code is either recorded in the script with a reason and a named trigger
      # for re-checking, or it fails here. It also fails if an accepted entry stops being reported,
      # so stale exceptions cannot pile up and hide the next real one.
      - name: Dependency advisories
        run: python3 scripts/check-dependency-advisories.py frontend

      - name: Test
        working-directory: frontend
        run: npm test

      # `npm run build` is `tsc -b && vite build`, so this type-checks as well as bundles.
      - name: Build
        working-directory: frontend
        run: npm run build

  admin-portal:
    name: Admin portal
    runs-on: [self-hosted, macOS, ARM64]
    # See the backend job for why. Shorter budget: no containers here, ~1m40s today.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7


      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: admin-portal/package-lock.json

      - name: Install
        working-directory: admin-portal
        run: npm ci

      # See the user frontend's Lint step for why this is here and why it fails on warnings.
      - name: Lint
        working-directory: admin-portal
        run: npm run lint

      # See the user frontend's step for why this exists.
      - name: Dependency advisories
        run: python3 scripts/check-dependency-advisories.py admin-portal

      - name: Test
        working-directory: admin-portal
        run: npm test

      - name: Build
        working-directory: admin-portal
        run: npm run build

  mobile:
    name: Mobile (Expo)
    runs-on: [self-hosted, macOS, ARM64]
    # See the backend job for why. Shorter budget: no containers here, ~1m40s today.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7


      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install
        working-directory: mobile
        run: npm ci

      # Mobile had no lint script at all until now -- `npx expo lint` set up eslint-config-expo
      # (see mobile/eslint.config.js for which of its rules are turned off and why). It caught a
      # dead ActivityIndicator import in ImportScreen.tsx on its first run.
      - name: Lint
        working-directory: mobile
        run: npm run lint

      # See the user frontend's step for why this exists.
      - name: Dependency advisories
        run: python3 scripts/check-dependency-advisories.py mobile

      - name: Type-check
        working-directory: mobile
        run: npm run typecheck

      - name: Test
        working-directory: mobile
        run: npm test

      # The bundle catches a different class of problem than the tests do: broken imports, bad
      # JSX, and anything that type-checks but can't actually be packaged. This is JS-only -- it
      # does NOT compile native code or produce an installable app, which needs EAS Build and, for
      # iOS, a macOS runner. Nothing here substitutes for the on-device checklist in
      # docs/engineering/mobile-setup.md.
      #
      # EXPO_PUBLIC_API_BASE_URL is required at import time by src/api/client.ts, which throws
      # when it's unset rather than silently falling back to a broken relative path. The value is
      # never contacted during a bundle -- it just has to exist for the module to evaluate.
      - name: Bundle (Metro)
        working-directory: mobile
        env:
          EXPO_PUBLIC_API_BASE_URL: https://ci.invalid
        run: npx expo export --platform android --output-dir /tmp/mobile-ci-bundle

  # The build-confidence gate: one pass through the whole product in a real browser, on every PR.
  #
  # Deliberately NOT the full 100+ spec end-to-end suite. That one covers edge cases, error paths
  # and behaviour at size, takes several minutes of browser time, and belongs on a nightly or
  # pre-release schedule -- putting it here would make every PR wait on it and teach people to
  # ignore it. e2e/tests/workflow/smoke.spec.ts asserts its own runtime budget so it stays fast.
  #
  # This is the first job here that needs a running backend AND a database AND both dev servers.
  # That is why the harness went in without CI wiring first: the cost is real and it is a separate
  # decision from installing the harness. The decision is that a suite which caught a defect where
  # the ledger and the dashboard disagreed by exactly the rows a user had asked for is worth two
  # minutes on a pull request.
  smoke:
    name: End-to-end smoke (Chromium)
    # `primary` PINS THIS JOB TO ONE RUNNER, and it is the reason a second runner can exist at all.
    #
    # This is the only job in the file that takes host-level state rather than working inside its
    # own workspace: a container named `finora-ci-postgres`, host port 5433, backend ports
    # 18081/18086/18088, and a teardown that runs `pkill -f 'finora-backend-.*\.jar'`. Every one of
    # those is machine-wide.
    #
    # So two runners on ONE machine would break it as soon as two runs reached this job together --
    # and not with a clean "port in use". The failure would be the teardown of one job killing the
    # OTHER job's backend halfway through its tests, which surfaces as assertion failures in
    # whichever PR happened to be unlucky. Fast and flaky is worse than slow and correct, especially
    # when the flake looks like a product bug.
    #
    # A label rather than a job-level `concurrency` group, deliberately. Concurrency keeps one job
    # running and one pending and CANCELS any older pending one -- and this repository has now spent
    # three separate investigations today on cancelled-reported-as-failed. Restricting eligibility
    # makes the second smoke job queue for a busy runner instead, which is the behaviour we actually
    # want and produces no confusing status.
    #
    # The other four jobs deliberately keep the unlabelled `[self-hosted, macOS, ARM64]` so either
    # runner can take them -- that is where the parallelism comes from. Adding a third runner needs
    # nothing here; adding host-level state to any OTHER job needs this same label.
    runs-on: [self-hosted, macOS, ARM64, primary]

    # Blocking, because it has passed on an isolated checkout: fresh clone, fresh database, fresh
    # backend, 9 specs in 34s. That run was worth doing rather than assuming -- it caught two
    # defects a working-tree run could not, because a working tree already has node_modules and
    # already has dev servers running:
    #
    #   * e2e/package-lock.json was out of sync with package.json, so `npm ci` failed outright.
    #     This job would have died at the install step every time.
    #   * The suite navigated the admin page with a relative path. This spec lives in
    #     tests/workflow/, whose project baseURL is the USER app, so the operator steps were
    #     asserting against the marketing site.
    #
    # Both are the kind of thing only a first composed run in a clean environment finds.
    # ~8x the local runtime. A hang detector, not a performance budget -- the suite's own budget
    # assertion is what catches it getting slower.
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      # This was a `services:` container on ubuntu-latest. Service containers are a Linux-container
      # feature and do not run on a macOS runner at all, so the same container is started by hand.
      #
      # Three things the `services:` block gave us for free that have to be written out here:
      #
      #   * The readiness gate. Without it the backend starts against a Postgres that has not
      #     finished initialising and dies on its first migration, which reads as a product failure
      #     and is not one. This is the `pg_isready` loop, matching the old health-cmd.
      #   * Teardown. `if: always()` so a failed or cancelled run does not leave the container (and
      #     port 5433) held against the next one.
      #   * A clean slate. A self-hosted workspace is REUSED, so unlike a fresh hosted VM a
      #     container from a previous run may still be up. `rm -f` first, unconditionally.
      #
      # 5433:5432 preserved exactly: the port is what e2e/ and the backend step below are
      # configured against, and it is deliberately not 5432 so a developer's local Postgres and a
      # CI run on the same machine cannot fight over the port.
      - name: Start Postgres
        run: |
          docker rm -f finora-ci-postgres >/dev/null 2>&1 || true
          docker run -d --name finora-ci-postgres \
            -e POSTGRES_DB=finora \
            -e POSTGRES_USER=finora \
            -e POSTGRES_PASSWORD=finora \
            -p 5433:5432 \
            postgres:16-alpine
          for i in $(seq 1 30); do
            if docker exec finora-ci-postgres pg_isready -U finora -d finora >/dev/null 2>&1; then
              echo "postgres ready after ${i} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "postgres did not become ready within 60s"
          docker logs finora-ci-postgres
          exit 1

      # Must track backend/pom.xml's java.version, not just the backend job's: this job runs
      # `./mvnw package` itself (see "Build the backend" below), so a JDK older than the compiler
      # release target fails here with "release version N not supported" even though nothing about
      # the smoke tests changed. Raise both together.
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin
          cache: maven


      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      # -DskipTests on purpose: the backend job above already ran them, and running them again here
      # would double the slowest thing in CI to produce the same answer.
      - name: Build the backend
        working-directory: backend
        run: ./mvnw -B -DskipTests package

      # Boots the artifact that actually ships, with Firebase credentials present, and fails on any
      # missing runtime class. This exists because of a production outage on 2026-08-08: httpclient5
      # was declared `<scope>test</scope>`, which Maven resolves as overriding the compile-scoped
      # copy firebase-admin needs, so the fat jar shipped without it and every boot died on
      # NoClassDefFoundError before the web server started.
      #
      # Two things had to both be true for that to reach production, and this step is aimed at the
      # second one.
      #
      # The backend job cannot see it: it runs `mvn test`, where the artifact is on the classpath
      # regardless of scope, while the image is built by `mvn package`, where it was not. So a fully
      # green suite says nothing about what ships.
      #
      # And the existing "Start the backend" step below cannot see it either, which is the
      # non-obvious half. FirebaseConfig is not profile-gated -- it is CREDENTIALS-gated. With
      # GOOGLE_APPLICATION_CREDENTIALS unset, GoogleCredentials.getApplicationDefault() throws
      # IOException first, FirebaseConfig catches it and returns null, and FirebaseOptions.build()
      # is never reached, so the class is never loaded. Running the jar under SPRING_PROFILES_ACTIVE
      # of prod would still not have caught this. The credentials are the gate, so the credentials
      # are what this step supplies.
      #
      # The key is generated here and thrown away. Its only job is to be parseable as a service
      # account, so that getApplicationDefault() succeeds and the class-loading path downstream of
      # it executes; it is never a real credential for a real project. Deliberately NOT claiming
      # anything here about whether initialization makes a network call -- that is the SDK's
      # business and it can change between versions, and this step does not depend on the answer.
      #
      # WHAT THIS DOES NOT COVER, so nobody reads it as more than it is: it proves the jar STARTS.
      # An integration whose classes load lazily can still start clean and then fail on the first
      # real request, which is the same failure one layer later. Closing that needs a smoke test
      # that hits one endpoint per critical integration and asserts the response is a normal
      # application error rather than a linkage error -- note the call does not have to SUCCEED to
      # be worth making, since a NoClassDefFoundError surfaces before any auth or network failure
      # would. Not built yet.
      #
      # Deliberately asserts on the ERROR CLASS, not on a list of expected jars. Verified against
      # both a broken and a fixed build of this exact jar, and the broken one names a DIFFERENT
      # missing class locally (HttpAsyncClient) than it did in production
      # (AsyncClientConnectionManager) because class load order varies by environment. An allowlist
      # of expected classes would have been pinned to whichever name someone saw first; this is not.
      - name: Production classpath check
        working-directory: backend
        env:
          SPRING_PROFILES_ACTIVE: dev
          SERVER_PORT: 18086
          DB_PORT: 5433
        run: |
          set -euo pipefail
          creds="$RUNNER_TEMP/classpath-check-credentials.json"
          openssl genrsa -out "$RUNNER_TEMP/classpath-check-key.pem" 2048 2>/dev/null
          python3 - "$RUNNER_TEMP/classpath-check-key.pem" "$creds" <<'PYTHON'
          import json, sys
          key = open(sys.argv[1]).read()
          json.dump({
              "type": "service_account",
              "project_id": "finora-classpath-check",
              "private_key_id": "0" * 40,
              "private_key": key,
              "client_email": "classpath-check@example.invalid",
              "client_id": "0" * 21,
              "token_uri": "https://oauth2.googleapis.com/token",
          }, open(sys.argv[2], "w"))
          PYTHON

          log="$RUNNER_TEMP/classpath-check.log"
          GOOGLE_APPLICATION_CREDENTIALS="$creds" \
            java -jar target/finora-backend-*.jar > "$log" 2>&1 &
          pid=$!

          started=no
          for _ in $(seq 1 45); do
            if curl -sf "http://localhost:${SERVER_PORT}/actuator/health" 2>/dev/null | grep -q '"UP"'; then
              started=yes; break
            fi
            kill -0 "$pid" 2>/dev/null || break
            sleep 2
          done
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true

          if grep -qE "NoClassDefFoundError|ClassNotFoundException" "$log"; then
            echo "BLOCKED: the packaged jar is missing a class it needs at runtime."
            echo "A dependency the application resolves at runtime is not in the fat jar --"
            echo "most often a direct <scope>test</scope> declaration overriding a compile-scoped"
            echo "transitive one. Check backend/pom.xml for the artifact named below."
            grep -E "NoClassDefFoundError|ClassNotFoundException" "$log" | head -5
            exit 1
          fi

          if [ "$started" != "yes" ]; then
            echo "BLOCKED: the packaged jar did not start under production-like configuration."
            echo "No missing-class error, so this is a different fault. Last 40 lines:"
            tail -40 "$log"
            exit 1
          fi
          echo "packaged jar started clean with Firebase credentials present"

      # The layer above. The step before proves the jar STARTS; this proves each critical library is
      # actually EXECUTED, which is a different question with a different failure. A dependency whose
      # classes load lazily starts clean and dies on the first real call -- the layer a user reaches.
      #
      # Runs the shipped jar with --verify-runtime-dependencies, which calls one real operation per
      # library and exits non-zero unless every one of them ran. A library rejecting synthetic input
      # is a PASS: a linkage error is thrown during class resolution, before any credential or
      # validation check, so reaching the rejection proves the classes behind it resolved.
      #
      # It also fails when a check STOPS reaching its library -- see RuntimeDependencyVerifier's
      # NOT_EXECUTED. Without credentials the Firebase probe short-circuits and proves nothing, and
      # reporting that as success is how a guard goes quietly useless. Reuses the credentials file
      # the previous step wrote, so if that step's generation ever breaks, this one goes red rather
      # than silently checking three libraries instead of four.
      - name: Runtime dependency verification
        working-directory: backend
        env:
          SPRING_PROFILES_ACTIVE: dev
          SERVER_PORT: 18088
          DB_PORT: 5433
        run: |
          set -euo pipefail
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/classpath-check-credentials.json" \
            java -jar target/finora-backend-*.jar --verify-runtime-dependencies

      - name: Install dependencies
        run: |
          npm ci --prefix frontend
          npm ci --prefix admin-portal
          npm ci --prefix e2e

      # Chromium only. The Firefox and Edge projects exist (npm run test:browsers) and are a
      # pre-release check -- engine-specific rendering changes far less often than business logic,
      # and tripling this job's runtime to find out would not be a good trade on every PR.
      #
      # No --with-deps, which it carried on ubuntu-latest. That flag installs the browser's system
      # libraries via apt-get and is Debian/Ubuntu-only; on macOS Playwright has no equivalent to
      # run, because the frameworks Chromium links against ship with the OS. Passing it here is at
      # best a no-op and at worst an error, and it would come back the moment this returns to a
      # Linux runner.
      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install chromium

      # Started here rather than by the suite's own stack script, which is built for a developer's
      # machine: it manages a Docker container (CI provides Postgres as a service) and detaches the
      # backend (CI needs it in the job's process tree so a crash fails the step). The ceilings are
      # raised for the same reason as locally -- the suite registers an account per test and stages
      # a statement in most of them, so production per-IP limits stop the run partway through every
      # time regardless of whether the product works.
      # PORT 18081, NOT 8081. 8081 is the React Native Metro bundler's default, and this runner is a
      # developer's own Mac rather than a disposable VM -- so `npx expo start` in mobile/ and this
      # step want the same port, and whoever binds first wins.
      #
      # That is not hypothetical. On 2026-08-08 three unrelated pull requests failed here at once,
      # including one whose entire diff was an `actions/checkout` version bump, because an Expo dev
      # server was running on the machine. The backend could not bind, the health poll ran its full
      # 60 attempts, and the step failed pointing at the change under test. `lsof -nP -iTCP:8081`
      # was the only thing that explained it.
      #
      # The file already predicted this failure two comments down ("the backend finds 8081 taken")
      # but blamed a leftover CI process, so nobody looked for a dev server. Choosing a port nothing
      # defaults to removes the class of failure rather than the last instance of it -- the same
      # reasoning that already picked 5433 over 5432 for Postgres.
      #
      # FINORA_E2E_API_ORIGIN is passed to the Smoke step below because e2e/ defaults to 8081 too
      # (fixtures/config.ts, playwright.config.ts, scripts/stack.mjs). That default is left alone:
      # it is the documented local convention and every read of it already goes through this
      # override, which exists for exactly this.
      - name: Start the backend
        working-directory: backend
        env:
          SPRING_PROFILES_ACTIVE: dev
          SERVER_PORT: 18081
          DB_PORT: 5433
          RATE_LIMIT_REGISTER_MAX: 10000
          RATE_LIMIT_LOGIN_MAX: 10000
          RATE_LIMIT_IMPORT_STAGE_MAX: 10000
        run: |
          java -jar target/finora-backend-*.jar > "$RUNNER_TEMP/backend.log" 2>&1 &
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:18081/actuator/health | grep -q '"UP"'; then
              echo "backend up"; exit 0
            fi
            sleep 2
          done
          echo "The backend never reported healthy. Last 50 lines:"
          tail -50 "$RUNNER_TEMP/backend.log"
          exit 1

      # Points the suite at the port the step above actually bound. Without this the harness falls
      # back to its 8081 default and talks to whatever happens to be there -- or nothing.
      - name: Smoke
        working-directory: e2e
        env:
          FINORA_E2E_API_ORIGIN: http://localhost:18081
        run: npm run test:smoke

      # The report and traces are the whole value of a failed E2E run -- without them the only
      # artefact is a one-line assertion message and nobody can tell what the page looked like.
      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

      # The backend log, for the case where the failure was server-side. Cheap, and the alternative
      # is re-running the job with a debug step added.
      - name: Upload the backend log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-backend-log
          path: ${{ runner.temp }}/backend.log
          retention-days: 7

      # Teardown, which ubuntu-latest did not need. The hosted VM was destroyed after the job and
      # took both of these with it; a self-hosted machine keeps running, so anything left here is
      # still holding its port when the next run starts. That failure is particularly nasty to
      # diagnose because it lands on the NEXT commit: Postgres finds 5433 taken, or the backend
      # finds 18081 taken, and the run fails for a reason that has nothing to do with the change
      # that triggered it.
      #
      # The backend needs an explicit kill because it is started with `&`. Backgrounding detaches it
      # from the step's shell, so it outlives the step, the job, and the workflow.
      #
      # `if: always()` because a failed or cancelled run is exactly when this matters most, and
      # `|| true` on each so a teardown that finds nothing left to clean is not itself a failure.
      - name: Tear down Postgres and the backend
        if: always()
        run: |
          docker rm -f finora-ci-postgres >/dev/null 2>&1 || true
          pkill -f 'finora-backend-.*\.jar' >/dev/null 2>&1 || true
