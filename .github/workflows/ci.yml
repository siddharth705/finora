name: CI

# The README has claimed this file existed since the "Architecture hardening, round 2" section,
# but it was never actually committed -- every push and PR has been unverified until now. Each job
# below was run locally against this exact tree before being written here, so the pipeline starts
# green rather than needing to be debugged in CI.
on:
  push:
    branches: ['**']
  pull_request:

# A new push to the same branch makes the in-flight run obsolete. Cancelling it keeps queue times
# down on a shared runner allowance -- but never for main, where every commit's result is a record
# worth keeping rather than something to discard when the next one lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    # No test count in the name: it was "934" while the suite was already at 936, because a
    # hardcoded total goes stale on the very next commit that adds a test and nothing fails when
    # it does. The job reports its own real count in the run output.
    name: Backend (Java 21)
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 because the PII check diffs a commit RANGE here rather than the index (see
      # its --range flag). A shallow checkout would not have the base commit, and the script would
      # fall back to scanning nothing -- passing vacuously, which reads as coverage in review.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # scripts/check-xml-comments.py exists because exactly this broke backend/pom.xml once --
      # an internal "--" inside an XML comment, which Maven's POM parser rejects outright with an
      # error that doesn't obviously point at the comment. It used to be a script nobody ran
      # automatically (no exit code on failure, not wired into CI or pre-commit, "python3
      # scripts/check-xml-comments.py" only ever in its own usage docstring) -- exactly the shape
      # that let the original incident happen, so catching it here rather than at `mvn` parse time
      # is the actual fix, not the script's mere existence.
      # The customer-PII guard. It was pre-commit-only, and that is three kinds of absent: it can
      # be skipped with --no-verify (a pressure its own header acknowledges), it is not installed
      # on a fresh clone unless someone runs `npm install` at the ROOT (hooks come from the root
      # package.json's "prepare": "husky", so anyone working only in backend/ has none), and
      # nothing on the server side ever looked.
      #
      # It is the sole automated control against recurrence of a real, still-open incident:
      # docs/engineering/incidents/2026-08-03-customer-pii-in-git-history.md, a customer's name and
      # 14-digit account number committed in a source comment, status "Open -- remediation
      # DEFERRED." This repository has already written down the principle, about a different
      # script, in this same file: "a script nobody ran automatically... exactly the shape that let
      # the original incident happen."
      #
      # fetch-depth 0 and an explicit range because the hook diffs the INDEX, which does not exist
      # on a CI checkout -- see the script's --range flag.
      - name: Customer PII check
        run: sh scripts/check-fixture-hygiene.sh --range "${{ github.event.pull_request.base.sha || github.event.before }}" "${{ github.sha }}"

      # Same absence, same fix. Its own comment records the shipped production bug it exists to
      # prevent -- "a 401-handling fix landed on web, missed mobile, and shipped a bug where a
      # mistyped password revoked every session on every device" -- and a guard against a bug that
      # already shipped once should not be skippable.
      - name: Client auth policy
        run: python scripts/check-client-auth-policy.py

      - name: XML comment check
        run: python scripts/check-xml-comments.py

      # Runs before setup-java so the diagnosis arrives before the step that would fail on it.
      # ./mvnw was committed non-executable and every backend run died here with a bare
      # "Permission denied" / exit 126 -- accurate, but it names a temp shell script rather than
      # the committed mode, which is why it went unread for the workflow's whole life.
      - name: Executable bits
        run: python scripts/check-executable-bits.py

      # Also before setup-java, and for the same reason: it names the file and the type, where
      # javac names a symbol at a line in whatever compiled first. Cheap enough (~0.4s over 476
      # files) that running it ahead of a 5-minute build is free.
      #
      # --self-test first, because this checker CAN be silently vacuous -- a tokeniser that
      # matches nothing passes every run and looks identical to a clean tree. The self-test asserts
      # it still detects a genuinely missing import, and still does NOT fire on the four patterns
      # that produced its historical false positives.
      - name: Import cross-reference (self-test)
        run: python scripts/check-imports.py --self-test

      - name: Import cross-reference
        run: python scripts/check-imports.py

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          # Keys off pom.xml, so a dependency change busts it and nothing else does.
          cache: 'maven'

      # No explicit Docker setup step: the suite's Testcontainers integration tests need a Docker
      # daemon, and ubuntu-latest runners already have one running.
      #
      # This claim used to be false. The 29 *IT classes never ran: surefire's default includes
      # don't match *IT.java (that's maven-failsafe's convention) and failsafe was never
      # configured, so the "Testcontainers tests" this comment promised had never executed once.
      # backend/pom.xml now widens surefire's includes, and the suite really does run them --
      # 1055 tests instead of 941, verified locally against a real daemon.
      #
      # That claim is no longer trust-me: the Test summary step below publishes the unit/IT split
      # to the run page and fails if the IT count is ever zero again.
      - name: Run tests
        working-directory: backend
        run: ./mvnw -B --no-transfer-progress test

      # `if: always()` so the breakdown renders for a FAILING run too -- that is when knowing
      # which classes failed, and whether the ITs ran at all, is worth most. It reports rather
      # than re-judges: a genuine test failure is already the previous step's exit code, and this
      # only adds a failure of its own for a hollow result (no reports, 0 tests, or 0 *IT).
      - name: Test summary
        if: always()
        run: python scripts/summarize-surefire.py

      # guardian-report.py was the last checker referenced only in documentation -- never in CI,
      # a hook, or a package script. That is precisely the anti-pattern the XML-comment step above
      # already records this repository diagnosing once, and it was left standing next to it.
      #
      # It joins GuardianRegistryTest's generated rule manifest against the surefire results, so it
      # needs the test step to have run and adds no work of its own. `if: always()` for the same
      # reason the summary uses it: on a failing run, knowing WHICH guardian rules broke is worth
      # most. It reports rather than re-judges -- a failed rule is already the test step's exit
      # code -- but it exits non-zero on a report it could not produce, so a manifest that stops
      # being generated is a failure rather than silence.
      - name: Repository Guardian report
        if: always()
        run: python scripts/guardian-report.py

      # The XML behind the summary, for reading a stack trace without re-running the suite.
      # Failures only: on a green run nobody opens it, and it is ~2MB of XML per run.
      - name: Upload surefire reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 14

  frontend:
    name: User frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the engines field in frontend/package.json (">=20.19.0").
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` (not `npm install`) so the lockfile is authoritative and CI can't silently
      # resolve a different dependency tree than a developer machine.
      - name: Install
        working-directory: frontend
        run: npm ci

      # `npm run lint` existed in package.json from the day eslint.config.js was written, but this
      # workflow never ran it -- a lint script nobody runs is indistinguishable from no lint script,
      # except that it looks like coverage in review. It runs with --max-warnings 0: the config's
      # own comments explain that its rules are chosen as bug diagnostics rather than style, so a
      # warning here is a finding, and warnings that never fail anything just accumulate.
      - name: Lint
        working-directory: frontend
        run: npm run lint

      # Runs from the repo root, not frontend/, because it scans all three apps: a dead support
      # address is equally broken in admin-portal or mobile, and the whole point is that no copy of
      # it escapes. Cheap and dependency-free, so it sits with lint rather than behind the tests.
      - name: Contact addresses
        run: python scripts/check-contact-addresses.py

      # `npm audit` in this repo has never been empty -- 18 vulnerability entries across the three
      # JS apps, every one already judged not to apply. That is exactly how a real advisory gets
      # missed: a command whose output is always non-empty is one people learn to skip, and the
      # open redirect fixed in 1ea5d13 sat in that noise. This check leaves no third state: an
      # advisory in shipped code is either recorded in the script with a reason and a named trigger
      # for re-checking, or it fails here. It also fails if an accepted entry stops being reported,
      # so stale exceptions cannot pile up and hide the next real one.
      - name: Dependency advisories
        run: python scripts/check-dependency-advisories.py frontend

      - name: Test
        working-directory: frontend
        run: npm test

      # `npm run build` is `tsc -b && vite build`, so this type-checks as well as bundles.
      - name: Build
        working-directory: frontend
        run: npm run build

  admin-portal:
    name: Admin portal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: admin-portal/package-lock.json

      - name: Install
        working-directory: admin-portal
        run: npm ci

      # See the user frontend's Lint step for why this is here and why it fails on warnings.
      - name: Lint
        working-directory: admin-portal
        run: npm run lint

      # See the user frontend's step for why this exists.
      - name: Dependency advisories
        run: python scripts/check-dependency-advisories.py admin-portal

      - name: Test
        working-directory: admin-portal
        run: npm test

      - name: Build
        working-directory: admin-portal
        run: npm run build

  mobile:
    name: Mobile (Expo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install
        working-directory: mobile
        run: npm ci

      # Mobile had no lint script at all until now -- `npx expo lint` set up eslint-config-expo
      # (see mobile/eslint.config.js for which of its rules are turned off and why). It caught a
      # dead ActivityIndicator import in ImportScreen.tsx on its first run.
      - name: Lint
        working-directory: mobile
        run: npm run lint

      # See the user frontend's step for why this exists.
      - name: Dependency advisories
        run: python scripts/check-dependency-advisories.py mobile

      - name: Type-check
        working-directory: mobile
        run: npm run typecheck

      - name: Test
        working-directory: mobile
        run: npm test

      # The bundle catches a different class of problem than the tests do: broken imports, bad
      # JSX, and anything that type-checks but can't actually be packaged. This is JS-only -- it
      # does NOT compile native code or produce an installable app, which needs EAS Build and, for
      # iOS, a macOS runner. Nothing here substitutes for the on-device checklist in
      # docs/engineering/mobile-setup.md.
      #
      # EXPO_PUBLIC_API_BASE_URL is required at import time by src/api/client.ts, which throws
      # when it's unset rather than silently falling back to a broken relative path. The value is
      # never contacted during a bundle -- it just has to exist for the module to evaluate.
      - name: Bundle (Metro)
        working-directory: mobile
        env:
          EXPO_PUBLIC_API_BASE_URL: https://ci.invalid
        run: npx expo export --platform android --output-dir /tmp/mobile-ci-bundle
