name: CI

# The README has claimed this file existed since the "Architecture hardening, round 2" section,
# but it was never actually committed -- every push and PR has been unverified until now. Each job
# below was run locally against this exact tree before being written here, so the pipeline starts
# green rather than needing to be debugged in CI.
on:
  push:
    branches: ['**']
  pull_request:

# A new push to the same branch makes the in-flight run obsolete. Cancelling it keeps queue times
# down on a shared runner allowance -- but never for main, where every commit's result is a record
# worth keeping rather than something to discard when the next one lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    # No test count in the name: it was "934" while the suite was already at 936, because a
    # hardcoded total goes stale on the very next commit that adds a test and nothing fails when
    # it does. The job reports its own real count in the run output.
    name: Backend (Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # scripts/check-xml-comments.py exists because exactly this broke backend/pom.xml once --
      # an internal "--" inside an XML comment, which Maven's POM parser rejects outright with an
      # error that doesn't obviously point at the comment. It used to be a script nobody ran
      # automatically (no exit code on failure, not wired into CI or pre-commit, "python3
      # scripts/check-xml-comments.py" only ever in its own usage docstring) -- exactly the shape
      # that let the original incident happen, so catching it here rather than at `mvn` parse time
      # is the actual fix, not the script's mere existence.
      - name: XML comment check
        run: python scripts/check-xml-comments.py

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          # Keys off pom.xml, so a dependency change busts it and nothing else does.
          cache: 'maven'

      # No explicit Docker setup step: the suite's Testcontainers integration tests need a Docker
      # daemon, and ubuntu-latest runners already have one running.
      #
      # This claim used to be false. The 29 *IT classes never ran: surefire's default includes
      # don't match *IT.java (that's maven-failsafe's convention) and failsafe was never
      # configured, so the "Testcontainers tests" this comment promised had never executed once.
      # backend/pom.xml now widens surefire's includes, and the suite really does run them --
      # 1055 tests instead of 941, verified locally against a real daemon.
      - name: Run tests
        working-directory: backend
        run: ./mvnw -B --no-transfer-progress test

  frontend:
    name: User frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the engines field in frontend/package.json (">=20.19.0").
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` (not `npm install`) so the lockfile is authoritative and CI can't silently
      # resolve a different dependency tree than a developer machine.
      - name: Install
        working-directory: frontend
        run: npm ci

      # `npm run lint` existed in package.json from the day eslint.config.js was written, but this
      # workflow never ran it -- a lint script nobody runs is indistinguishable from no lint script,
      # except that it looks like coverage in review. It runs with --max-warnings 0: the config's
      # own comments explain that its rules are chosen as bug diagnostics rather than style, so a
      # warning here is a finding, and warnings that never fail anything just accumulate.
      - name: Lint
        working-directory: frontend
        run: npm run lint

      # Runs from the repo root, not frontend/, because it scans all three apps: a dead support
      # address is equally broken in admin-portal or mobile, and the whole point is that no copy of
      # it escapes. Cheap and dependency-free, so it sits with lint rather than behind the tests.
      - name: Contact addresses
        run: python scripts/check-contact-addresses.py

      # `npm audit` in this repo has never been empty -- 18 vulnerability entries across the three
      # JS apps, every one already judged not to apply. That is exactly how a real advisory gets
      # missed: a command whose output is always non-empty is one people learn to skip, and the
      # open redirect fixed in 1ea5d13 sat in that noise. This check leaves no third state: an
      # advisory in shipped code is either recorded in the script with a reason and a named trigger
      # for re-checking, or it fails here. It also fails if an accepted entry stops being reported,
      # so stale exceptions cannot pile up and hide the next real one.
      - name: Dependency advisories
        run: python scripts/check-dependency-advisories.py frontend

      - name: Test
        working-directory: frontend
        run: npm test

      # `npm run build` is `tsc -b && vite build`, so this type-checks as well as bundles.
      - name: Build
        working-directory: frontend
        run: npm run build

  admin-portal:
    name: Admin portal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: admin-portal/package-lock.json

      - name: Install
        working-directory: admin-portal
        run: npm ci

      # See the user frontend's Lint step for why this is here and why it fails on warnings.
      - name: Lint
        working-directory: admin-portal
        run: npm run lint

      # See the user frontend's step for why this exists.
      - name: Dependency advisories
        run: python scripts/check-dependency-advisories.py admin-portal

      - name: Test
        working-directory: admin-portal
        run: npm test

      - name: Build
        working-directory: admin-portal
        run: npm run build

  mobile:
    name: Mobile (Expo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install
        working-directory: mobile
        run: npm ci

      # Mobile had no lint script at all until now -- `npx expo lint` set up eslint-config-expo
      # (see mobile/eslint.config.js for which of its rules are turned off and why). It caught a
      # dead ActivityIndicator import in ImportScreen.tsx on its first run.
      - name: Lint
        working-directory: mobile
        run: npm run lint

      # See the user frontend's step for why this exists.
      - name: Dependency advisories
        run: python scripts/check-dependency-advisories.py mobile

      - name: Type-check
        working-directory: mobile
        run: npm run typecheck

      - name: Test
        working-directory: mobile
        run: npm test

      # The bundle catches a different class of problem than the tests do: broken imports, bad
      # JSX, and anything that type-checks but can't actually be packaged. This is JS-only -- it
      # does NOT compile native code or produce an installable app, which needs EAS Build and, for
      # iOS, a macOS runner. Nothing here substitutes for the on-device checklist in
      # docs/engineering/mobile-setup.md.
      #
      # EXPO_PUBLIC_API_BASE_URL is required at import time by src/api/client.ts, which throws
      # when it's unset rather than silently falling back to a broken relative path. The value is
      # never contacted during a bundle -- it just has to exist for the module to evaluate.
      - name: Bundle (Metro)
        working-directory: mobile
        env:
          EXPO_PUBLIC_API_BASE_URL: https://ci.invalid
        run: npx expo export --platform android --output-dir /tmp/mobile-ci-bundle
