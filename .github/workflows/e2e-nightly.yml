name: E2E (full suite)

# BH-048 and BH-049 from docs/engineering/reviews/2026-08-08-repo-wide-bug-hunt.md.
#
# ci.yml runs `npm run test:smoke` -- nine specs, one pass through the product -- and its own
# comment says the rest "belongs on a nightly or pre-release schedule". That schedule did not
# exist. `.github/workflows/` contained exactly one file, nothing invoked `npm run test`
# (`--grep-invert @smoke`), and nothing invoked the cross-browser or responsive projects. So the
# only automated browser coverage any change ever received was those nine specs, and the twelve
# spec files holding the error paths, the negative cases and the behaviour-at-size ran when
# somebody remembered to run them by hand.
#
# This is deliberately NOT moved into ci.yml. The trade the smoke job makes is sound: a suite that
# every pull request waits on is a suite people learn to route around, and the full run needs
# minutes of browser time. What was wrong was having only one half of that trade.
#
# WHAT THIS SHARES WITH ci.yml'S smoke JOB, AND WHY THAT IS SAFE
# ---------------------------------------------------------------
# The same backend ports (18081) and the same shape of Postgres service. On the self-hosted runner
# this repository used before going public, both jobs pinned to a `primary`-labelled runner so they
# could never run concurrently on that one machine -- a container name, host ports and a teardown
# that all reached machine-wide would otherwise let one job's teardown kill the other's backend
# mid-test. GitHub-hosted runners give every job its own fresh, isolated VM, so that conflict is
# structurally impossible now and the `primary` label is gone from both workflows.
#
# WHEN IT RUNS
# ------------
# 03:00 UTC daily, on a GitHub-hosted runner that starts fresh for the scheduled run -- no runner
# uptime or "is the machine awake" caveat to carry here anymore. workflow_dispatch still exists so
# a release can force a run on demand rather than waiting for the schedule.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      browsers:
        description: 'Also run the Firefox/Edge and tablet/mobile projects (slower)'
        type: boolean
        default: false

# A scheduled run that is still going when the next one fires should not be joined by it.
concurrency:
  group: e2e-full
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  full-suite:
    name: Full Playwright suite (Chromium)
    # See the header: GitHub-hosted runners give every job its own isolated VM, so this and
    # ci.yml's smoke job can never contend over a container, port or teardown -- the `primary`
    # label that used to pin both to one self-hosted machine is gone.
    runs-on: ubuntu-latest
    # Generous next to smoke's 25: this is the whole suite rather than nine specs, and a hang
    # detector is all this number is meant to be.
    timeout-minutes: 60

    # A `services:` container, same as ci.yml's smoke job -- see that file for why this replaced
    # the self-hosted period's hand-rolled `docker run` + readiness loop.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: finora
          POSTGRES_USER: finora
          POSTGRES_PASSWORD: finora
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U finora -d finora"
          --health-interval=2s
          --health-timeout=5s
          --health-retries=30

    steps:
      - uses: actions/checkout@v7

      # Must track backend/pom.xml's java.version -- this job packages the backend itself.
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      # cache-dependency-path lists all three lockfiles this job installs below (frontend,
      # admin-portal, e2e) -- setup-node hashes each of them into the cache key, same as it would
      # for a single-app job's own cache-dependency-path.
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            admin-portal/package-lock.json
            e2e/package-lock.json

      # -DskipTests because ci.yml's backend job already ran them on this commit. This job exists
      # to exercise the product through a browser, not to re-answer a question already answered.
      - name: Build the backend
        working-directory: backend
        run: ./mvnw -B -DskipTests package

      - name: Install dependencies
        run: |
          npm ci --prefix frontend
          npm ci --prefix admin-portal
          npm ci --prefix e2e

      # Chromium always. Firefox/Edge and the responsive projects are opt-in via the dispatch input
      # below, because engine-specific rendering changes far less often than business logic and
      # tripling the runtime nightly would not pay for itself.
      #
      # --with-deps installs the browsers' system libraries via apt-get, which a bare ubuntu-latest
      # image needs and does not carry by default.
      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Install the other browsers
        if: ${{ inputs.browsers }}
        working-directory: e2e
        run: npx playwright install --with-deps firefox webkit

      # PORT 18081, not 8081 (the React Native Metro bundler's default): kept from the self-hosted
      # period, where this runner doubled as a developer's own Mac and whoever bound the port first
      # won. A GitHub-hosted job has the VM to itself, so the collision this port was chosen to
      # avoid can't happen here, but there's no reason to move it back either.
      #
      # The rate-limit ceilings are raised for the same reason ci.yml raises them: the suite
      # registers an account per test and stages a statement in most of them, so production per-IP
      # limits stop the run partway through regardless of whether the product works.
      - name: Start the backend
        working-directory: backend
        env:
          SPRING_PROFILES_ACTIVE: dev
          SERVER_PORT: 18081
          DB_PORT: 5433
          RATE_LIMIT_REGISTER_MAX: 10000
          RATE_LIMIT_LOGIN_MAX: 10000
          RATE_LIMIT_IMPORT_STAGE_MAX: 10000
          # The unified /auth entry screen calls POST /auth/identify before every sign-in, which
          # the suite's signIn() fixture now does too -- raised for the same reason as LOGIN above.
          RATE_LIMIT_IDENTIFY_MAX: 10000
          # AuthContext's bootstrap effect calls POST /auth/refresh on every page load (unrelated
          # to this PR -- see that effect's own comment). The default ceiling (15/300s) was never
          # hit before because the suite's userPage/adminPage fixtures create a fresh page per
          # test; investigating a smoke-job 429, the backend log showed exactly 15 refresh calls
          # went through before the next one tripped it. Raised for the same reason as the others.
          RATE_LIMIT_REFRESH_MAX: 10000
        run: |
          java -jar target/finora-backend-*.jar > "$RUNNER_TEMP/backend.log" 2>&1 &
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:18081/actuator/health | grep -q '"UP"'; then
              echo "backend up"; exit 0
            fi
            sleep 2
          done
          echo "The backend never reported healthy. Last 50 lines:"
          tail -50 "$RUNNER_TEMP/backend.log"
          exit 1

      # `npm run test` is `playwright test --grep-invert @smoke` -- everything ci.yml does NOT run.
      - name: Full suite
        working-directory: e2e
        env:
          FINORA_E2E_API_ORIGIN: http://localhost:18081
        run: npm run test

      - name: Cross-browser projects
        if: ${{ inputs.browsers && !cancelled() }}
        working-directory: e2e
        env:
          FINORA_E2E_API_ORIGIN: http://localhost:18081
        run: npm run test:browsers

      - name: Responsive projects
        if: ${{ inputs.browsers && !cancelled() }}
        working-directory: e2e
        env:
          FINORA_E2E_API_ORIGIN: http://localhost:18081
        run: npm run test:responsive

      # The report and traces are the whole value of a failed run -- without them the only artefact
      # is a one-line assertion message and nobody can tell what the page looked like. Retained
      # longer than ci.yml's seven days: nobody is watching a 03:00 run in real time, so the
      # artefact has to survive until someone looks.
      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-full-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 30

      - name: Upload the backend log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-full-backend-log
          path: ${{ runner.temp }}/backend.log
          retention-days: 30

      # Postgres is a `services:` container, so GitHub tears it down with the job. The backend
      # still needs an explicit kill: it is started with `&`, which detaches it from the step's
      # shell. `always()`, not `!cancelled()`, because a cancelled run is exactly when a
      # backgrounded jar most needs killing.
      - name: Tear down the backend
        if: always()
        run: pkill -f 'finora-backend-.*\.jar' >/dev/null 2>&1 || true
