# Dependency update monitoring.
#
# WHY THIS EXISTS
# ---------------
# scripts/check-dependency-advisories.py already gates the build on npm advisories in shipped code,
# with a maintained allowlist. It covers frontend, admin-portal and mobile -- and nothing else.
#
# Nothing watches the Java side. Spring Boot, Jackson, the PostgreSQL driver, Firebase Admin and
# every other Maven dependency in a backend that parses customer bank statements had no CVE
# monitoring at all. That is the gap this closes; the npm ecosystems below are secondary and
# complementary (the script fails a build, Dependabot opens the PR that fixes it).
#
# github-actions is included because it is free to watch and we are already paying for the omission:
# every CI run currently warns that actions/setup-java@v4 is deprecated and that Node 20 actions are
# being force-run on Node 24.
#
# ON GROUPING AND LIMITS
# ----------------------
# Deliberately conservative. A dependency bot that opens twenty PRs a week is one whose PRs stop
# being read, which is the same signal-to-noise failure documented in check-dependency-advisories.py
# and TESTING_AND_QUALITY_TOOLING_REVIEW.md. Minor and patch updates are grouped into a single PR
# per ecosystem so routine churn is one review, not twenty. Majors stay separate because they carry
# breaking changes and deserve their own discussion.
#
# Security updates ignore `schedule` and `open-pull-requests-limit` by design -- GitHub raises those
# immediately regardless of the settings below, which is the intended behaviour: the noisy half is
# throttled, the half that matters is not.
version: 2

updates:
  # The gap this file was actually written for.
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      maven-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"

  # ON THE `react` GROUP, which is the exception to "majors stay separate" above.
  #
  # That rule is right for independent dependencies and wrong for a peer-locked set. React ships as
  # four packages that must move together: `@types/react-dom@18.x` declares a peer dependency on
  # `@types/react@^18`, so raising one without the other produces a tree npm cannot resolve at all.
  #
  # It is not hypothetical. Excluding majors from grouping split the 18 -> 19 upgrade into two
  # separate PRs, each holding half of it, each individually un-mergeable:
  #
  #   #16  bumps react + @types/react in /frontend      -> ERESOLVE, npm ci fails, build dies
  #   #14  bumps react-dom + @types/react-dom in /admin-portal  -> the same, mirrored
  #
  # Splitting them did not produce two discussable upgrades. It produced two broken branches and a
  # red Cloudflare build, and neither could be merged even after review.
  #
  # So the four move as one PR, across every update type including major. A React major still gets
  # its own PR and its own discussion -- which is what the rule above actually wanted -- it just
  # arrives complete rather than in halves.
  #
  # Listed BEFORE npm-minor-and-patch deliberately: a dependency joins the first group it matches,
  # so a minor react bump has to be caught here rather than by the catch-all, or it splits again.
  # Patterns are exact names, not prefixes -- `react` does not match `react-router` or
  # `react-native`.
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
        update-types: [major, minor, patch]
      npm-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"

  # Same `react` group as /frontend, for the same reason -- see the comment above it. This app is
  # where #14 landed its half of the split upgrade.
  - package-ecosystem: npm
    directory: /admin-portal
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
        update-types: [major, minor, patch]
      npm-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"

  # Expo pins a large, tightly-coupled dependency set and upgrades are expected to move together
  # with the SDK rather than individually -- so the limit here is lower on purpose. An unsolicited
  # bump of a single Expo-managed package is usually noise, not an upgrade.
  #
  # Deliberately NO `react` group here, despite this app having react and react-dom too. Grouping
  # them would not help: their versions are dictated by the Expo SDK, so a react bump arriving on
  # its own is something to close rather than something to merge as a set. The fix for mobile is an
  # SDK upgrade, which moves react along with everything else it pins. Grouping would only make an
  # unmergeable PR tidier.
  #
  # react-native is ignored past 0.86.x for the same reason, learned the hard way: PR #202 grouped
  # a 0.86.2 -> 0.87.0 bump into npm-minor-and-patch (a "minor" bump by Dependabot's own rules) and
  # broke all 37 mobile test suites -- `@react-native/assets-registry/registry` was renamed/split in
  # 0.87.0 and jest-expo ~57.0.4 (the version paired with Expo SDK 57) still imports the old path.
  # Expo SDK 57 only supports react-native@0.86.x, so a bump past it is never mergeable, grouped or
  # not. `ignore` is used here rather than the group's `exclude-patterns`: exclude-patterns only
  # keeps a dependency out of the group, it would still let Dependabot open a standalone PR
  # proposing the same incompatible version -- smaller blast radius, same broken PR. `ignore` stops
  # the version from being proposed at all. Patch releases within 0.86.x are still allowed. Revisit
  # when Expo ships SDK 58 with react-native@0.87.x support, at which point expo, jest-expo and
  # react-native should all be bumped together (see #242).
  #
  # react-native-reanimated and react-native-worklets are ignored past 4.5.1/0.10.1 for a peer-
  # dependency conflict, not a react-native-shaped module-path break: PR #1055 grouped
  # reanimated 4.5.1 -> 4.6.0 and worklets 0.10.1 -> 0.12.1 with an expo 57.0.18 -> 57.0.19 bump
  # and broke all 84 mobile test suites the same "Cannot find module 'expo-modules-core'" way.
  # Root cause, isolated by bisection (each alone reproduces it, independent of the other):
  # reanimated 4.6.0's own peerDependencies HARD-requires react-native-worklets "0.12.x", while
  # expo-modules-core@57.0.15 (pulled in by expo 57.0.19) has an OPTIONAL peer capping worklets at
  # "^0.7.4 || ^0.8.0 || ^0.9.0 || ^0.10.0" -- no single top-level worklets version can satisfy
  # both, so npm de-hoists expo-modules-core into a nested copy to resolve the conflict, and
  # jest-expo's setup.js (a plain top-level `require('expo-modules-core')`) can no longer find it.
  # This is an upstream timing gap, not a config error here: Expo has not yet published an
  # expo-modules-core whose peer range accepts worklets 0.12.x, even though Reanimated has already
  # shipped that pairing. Revisit once Expo does -- at which point expo, reanimated and worklets
  # should all be bumped together, the same reasoning as the react-native/expo pairing above.
  - package-ecosystem: npm
    directory: /mobile
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "react-native"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "react-native-reanimated"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "react-native-worklets"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"

  # Test-only tooling, so advisories here are not shipped-code risk. Watched anyway because a stale
  # Playwright drifts from the browsers it drives, which shows up as flake rather than as a warning.
  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"

  # Would already have flagged the setup-java@v4 deprecation and the Node 20 runtime warnings that
  # appear on every run today.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      actions:
        update-types: [minor, patch]
    commit-message:
      prefix: "ci(deps)"

  # backend/Dockerfile's base image. This watches the TAG only -- it tells us a newer base exists,
  # not whether the current one has known CVEs. Those are different questions and this answers the
  # cheaper one; Trivy image scanning (roadmap phase 2) answers the other, which is why the roadmap
  # keeps both rather than treating this as sufficient.
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"
