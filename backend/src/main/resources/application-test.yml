spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:finora_test}
  jpa:
    show-sql: false

logging:
  level:
    root: WARN
    com.finora: INFO

# The merchant-learning queue's scheduler and async nudge are off by default under test, so the
# suite is deterministic: an event enqueued by one test must not be drained by a background thread
# while another test is asserting on it. Tests that exercise the queue drive it explicitly through
# MerchantLearningEventWorker.drainOnce(), which deliberately does not consult this flag.
# MerchantLearningNudgeIT turns it back on for the one case that has to prove the async path works.
app:
  learning:
    queue:
      enabled: false

  # BH-047 moved the expired-import-session sweep from the upload path to a scheduled job. Off
  # under test for the same reason the learning queue's poller is: a background thread deleting
  # import_sessions rows mid-run is precisely the cross-test pollution BH-058 was about. Tests that
  # exercise the sweep call ImportSessionService.sweepExpiredSessions() directly, which deliberately
  # does not consult this flag.
  import:
    session-cleanup:
      enabled: false

  # BH-017. Same reasoning as session-cleanup above: a background thread reclaiming R2/filesystem
  # objects mid-test is exactly the cross-test pollution BH-058 was about. Tests that exercise the
  # sweep call StatementStorageSweepService.sweep() directly, which does not consult this flag.
  statement-storage:
    sweep:
      enabled: false

  # BH-044. Same reasoning as statement-storage.sweep above: a background thread rewriting
  # audit_logs rows (clearing metadata, stamping redacted_at) mid-test is exactly the cross-test
  # pollution BH-058 was about -- a test asserting on a row's real metadata could otherwise lose
  # a race against the scheduler wiping it out from under the assertion. Tests that exercise the
  # sweep call AuditService.redactExpiredMetadata() directly, which does not consult this flag.
  audit:
    redaction:
      enabled: false

  # Gmail OAuth (Phase B). The client stays unconfigured under test -- the endpoints' behaviour
  # WITHOUT a Google client is itself part of what GmailOAuthEndpointIT pins, and no test should
  # depend on real Google credentials.
  #
  # post-connect-redirect is pointed at localhost deliberately: the callback answers with a 302, and
  # anything that follows redirects (TestRestTemplate does, by default) would otherwise make a live
  # request to the production frontend from the test suite.
  integrations:
    google:
      post-connect-redirect: http://localhost/settings
      # Same reasoning as import.session-cleanup above: a background thread deleting
      # gmail_oauth_states mid-run is the cross-test pollution BH-058 was about. Tests call
      # GmailConnectionService.sweepExpiredStates() directly, which ignores this flag.
      state-cleanup:
        enabled: false
      # Off for a stronger reason than the sweep above: this worker makes OUTBOUND HTTP CALLS. Left
      # on, a scheduled tick during an integration test would try to reach Google with whatever
      # connection rows that test just inserted. Tests call GmailDiscoveryWorker.runOnce() directly,
      # which ignores this flag.
      discovery:
        enabled: false
