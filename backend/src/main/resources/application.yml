# Base configuration shared by every profile. Profile-specific files
# (application-dev.yml / application-test.yml / application-prod.yml) override
# individual keys as needed â€” this file should never contain anything that's
# actually a secret, only sane defaults and structure.

# Bug fix (production-readiness pass): there was no server.port configuration anywhere at all,
# in any profile -- Spring Boot silently falls back to its own built-in default (8080)
# regardless. That's fine for local/Docker use, but Railway (like Heroku and most PaaS
# platforms) assigns its own dynamic port via the PORT env var and routes external traffic
# specifically to whatever port the app actually binds to -- there's no guarantee it happens to
# be 8080. An app that ignores $PORT and always binds to a fixed port is a well-known, easy way
# for a Railway deployment to build and start successfully while still being completely
# unreachable, since Railway's networking layer never learns to route to the port the app
# picked. ${PORT:8080} keeps every existing local/Docker workflow byte-for-byte identical
# (nothing sets PORT there, so it falls back to 8080 exactly as before) while actually working
# on Railway.
server:
  port: ${PORT:8080}
  # Production-readiness pass: gzip was off (Spring Boot's own default) -- a real, easy win for a
  # JSON API serving report/transaction-list payloads to a browser over the actual internet
  # (Railway <-> Cloudflare-hosted frontend), not just localhost. min-response-size stays at the
  # framework default (2KB) -- most of this API's responses are well above that.
  compression:
    enabled: true
    mime-types: application/json,text/plain
  # Graceful shutdown (Spring Boot 2.3+): Railway sends SIGTERM to the running container on every
  # deploy (this repo's own auto-deploy-on-push-to-main setup means that's routine, not rare) --
  # without this, an in-flight request gets its connection abruptly cut rather than allowed to
  # finish. spring.lifecycle.timeout-per-shutdown-phase below bounds how long Spring Boot will
  # wait for in-flight requests before giving up and shutting down anyway.
  shutdown: graceful

spring:
  application:
    name: finora-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  lifecycle:
    timeout-per-shutdown-phase: 20s

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:finora}
    username: ${DB_USER:finora}
    password: ${DB_PASSWORD:finora}
    driver-class-name: org.postgresql.Driver
    # Production-readiness pass: this ran entirely on HikariCP's own defaults (10 max, no explicit
    # connection timeout) -- fine for local dev against a Postgres with no other real load, but
    # worth setting deliberately for a real deployment: a smaller Railway Postgres plan has its
    # own real connection ceiling shared across however many services/replicas talk to it, so an
    # explicit, modest pool size here is a deliberate choice, not an accident of whatever the
    # framework happened to default to. connection-timeout fails fast (10s) rather than letting a
    # request hang indefinitely if the database is briefly unreachable.
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 10000

  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only validates it matches at startup.
      ddl-auto: validate
    # Declared explicitly because Spring Boot's default is `true` and every other JPA property
    # here carries a justifying comment -- an undeclared but behaviour-significant default was the
    # one thing in this block nobody had decided. `true` holds the EntityManager, and with it a
    # pooled connection, open for the whole request including view rendering and serialization;
    # against a 10-connection pool (see ImportConcurrencyLimiter's own reasoning about that pool)
    # that is a real ceiling on concurrency.
    #
    # `false` is the choice here: every service method that touches lazy state is already
    # @Transactional, and the one place that genuinely depends on an open session inside the
    # request -- StatementImportService.getFile reading lazily-fetched bytes -- says so in its own
    # comment and does the read inside its transaction, not outside it. Anything that regresses
    # this surfaces loudly as LazyInitializationException in the test suite rather than quietly as
    # connection-pool pressure in production.
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true
        # Backstop for any association without an explicit @BatchSize (User.roles and
        # Role.permissions carry their own). Without this, Hibernate loads collections one query
        # per owner -- the N+1 that made admin user listings scale with page size.
        default_batch_fetch_size: 25

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Production-readiness pass: multipart uploads (CSV/PDF statement import) ran on Spring Boot's
  # own defaults (1MB max file size, 10MB max request size) -- unexamined, not a deliberate
  # choice, and 1MB is genuinely too small for some real multi-page bank statement PDFs/a full
  # year of CSV transactions. RateLimitFilter's importStageLimiter already bounds how often this
  # endpoint can be called at all; this bounds how large any single call can be.
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:10MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:10MB}

app:
  build:
    # Which commit this build came from, for Platform Diagnostics. A FALLBACK, not the primary
    # source: git-commit-id-maven-plugin writes real git.properties whenever it can see a .git
    # directory, and AdminDiagnosticsService prefers that -- it is derived from the tree that was
    # actually compiled and cannot disagree with it.
    #
    # The fallback exists because the production image has no .git to read. backend/Dockerfile
    # copies pom.xml and src, and its build context is backend/ while .git sits at the repository
    # root, so the plugin silently produces nothing there (failOnNoGitDirectory=false, which is
    # right for a local build before a first commit). The result was a "Git commit" field that
    # worked on every developer machine and was blank on every deployed environment -- blank
    # exactly when someone is asking "which build is actually live?".
    #
    # RAILWAY_GIT_COMMIT_SHA is set by Railway per deployment, so the deployment target needs no
    # manual variable. GIT_COMMIT is the generic override for any other builder (a CI job can pass
    # it, or a Docker build can bake it via --build-arg). Empty everywhere else, which reports as
    # unavailable exactly as before.
    commit: ${GIT_COMMIT:${RAILWAY_GIT_COMMIT_SHA:}}
  jwt:
    # 32+ char secret required for HS256. Override via env var in every real deployment â€”
    # never commit a real secret; this default is only safe because it's obviously a placeholder.
    secret: ${JWT_SECRET:change-this-to-a-long-random-secret-in-your-env-file-min-32-chars}
    # Access tokens are short-lived by design â€” 15 minutes, not 24 hours â€” because a leaked
    # access token that expires quickly limits the damage window. Long-lived sessions are handled
    # by the refresh token instead, which can be individually revoked (the access token can't).
    expiration-ms: ${JWT_EXPIRATION_MS:900000}          # 15 min
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:2592000000}  # 30 days
    # Two independent limits on top of the refresh token's own expiry, because on their own a
    # 15-minute access token and a rotating 30-day refresh token produce a session that NEVER ends:
    # every rotation issues a fresh 30 days, so using the app once a month keeps you signed in
    # forever. For a product holding bank statements, tax documents and salary slips, that is the
    # wrong default -- it is the e-commerce answer, not the financial one.
    #
    # Idle: how long without a refresh before the session dies. Rotation happens whenever the
    # client needs a new access token, so the current token's age is a direct measure of
    # inactivity. 30 minutes matches what banks do. Raise it if support sees people being signed
    # out mid-task (the ErrorCode for it, AUTH_005, is deliberately distinct so that is visible in
    # logs rather than buried in generic expiry).
    idle-timeout-ms: ${JWT_IDLE_TIMEOUT_MS:1800000}                 # 30 min
    # Absolute: the longest a session may live no matter how actively it is used, measured from
    # sign-in and unaffected by rotation. This is the one that ends "logged in since March".
    absolute-session-ms: ${JWT_ABSOLUTE_SESSION_MS:604800000}       # 7 days
    #
    # Both accept 0 to disable, which exists for tests and for a deliberate, documented decision --
    # not as a convenient way to silence an inconvenient logout.
  cors:
    # Both frontends by default: the user app (frontend/, port 5173) and the admin portal
    # (admin-portal/, port 5174) -- see CorsConfig, which .trim()s each entry, so the comma
    # here doesn't need surrounding spaces to work correctly.
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:5174}
  email:
    # Empty by default â€” falls back to logging + returning the reset link in the API response
    # (dev convenience). Set RESEND_API_KEY to switch to sending real emails via Resend.
    api-key: ${RESEND_API_KEY:}
    from-address: ${EMAIL_FROM:onboarding@resend.dev}
    # Optional display name shown alongside from-address -- unset means every real mail client
    # just shows the bare address, exactly the previous behavior.
    from-name: ${EMAIL_FROM_NAME:}
    app-base-url: ${APP_BASE_URL:http://localhost:5173}
    # Optional -- the user frontend and admin portal are two separate deployed apps at two
    # different origins, each with its own /reset-password page, but there's no separate admin
    # auth service (admin "Forgot Password" goes through this exact same forgotPassword() method).
    # Left unset, every reset link still falls back to app-base-url above, exactly as before this
    # setting existed -- see EmailProperties.resolveBaseUrl()'s own doc comment for the real bug
    # this fixes once it IS set. Local dev default (5174) matches CORS_ORIGINS' own default above.
    admin-app-base-url: ${ADMIN_APP_BASE_URL:http://localhost:5174}
  # Phone verification (registration, password reset, authenticated password change) is Firebase
  # Phone Authentication now -- see FirebaseConfig's own doc comment for the full architecture.
  # The Firebase Admin SDK reads its own credentials from the standard
  # GOOGLE_APPLICATION_CREDENTIALS environment variable (a service-account JSON key file path),
  # not a Spring @ConfigurationProperties binding, so there's no app.sms.* entry for it here.
  sms:
    two-factor:
      # Empty by default â€” falls back to logging only (NoOpSmsProvider), not a hard boot-time
      # requirement in prod (see SmsProperties' own doc comment for why: unlike RESEND_API_KEY,
      # a missing transaction-alert SMS provider is a degraded notification, not a security gap).
      # 2Factor is used for real-time transaction alerts only -- never authentication OTPs, which
      # stay on Firebase Phone Authentication.
      api-key: ${TWO_FACTOR_API_KEY:}
  setup:
    # Empty by default â€” BootstrapService generates a random key and writes it to
    # .finora/installation.key for local/dev use (see docker-compose.yml's bind mount for that path).
    # Set FINORA_SETUP_KEY in any deployment where an operator supplies the key themselves
    # (deployment config, a secret manager) instead of one being generated or written anywhere â€”
    # see RFC-BOOTSTRAP-01 in docs/bootstrap-setup-future-work.md for the full production story.
    key: ${FINORA_SETUP_KEY:}
  security:
    # RateLimitFilter's own doc comment already flagged this: request.getRemoteAddr() only
    # returns the real client IP when nothing sits between the client and this app. Railway (like
    # any PaaS with an edge proxy/load balancer in front of your container) means every request
    # actually arrives from Railway's own internal proxy -- getRemoteAddr() returns THAT IP for
    # every single request, so every user on the platform would silently share one rate-limit
    # bucket. False by default (safe for local dev and any deployment NOT behind a real proxy,
    # where trusting a client-supplied X-Forwarded-For would let anyone spoof any IP and bypass
    # rate limiting entirely) -- set TRUST_PROXY_HEADERS=true specifically when actually deployed
    # behind Railway (or any other trusted reverse proxy) so RateLimitFilter reads the real client
    # IP from X-Forwarded-For instead.
    trust-proxy-headers: ${TRUST_PROXY_HEADERS:false}
    # How long a started Change Password flow (PasswordChangeSession) stays usable before its own
    # isExpired() check starts rejecting verify-otp/complete calls against it. A property rather
    # than a hardcoded constant so it can be tuned per-deployment without a code change.
    password-change-session-expiry-minutes: ${PASSWORD_CHANGE_SESSION_EXPIRY_MINUTES:15}
  # Per-IP ceilings for the endpoints RateLimitFilter guards. Every default below is the value that
  # used to be hardcoded in that class, so leaving this block alone changes nothing.
  #
  # Made configurable for two reasons, both in RateLimitFilter's own doc comment. Operationally,
  # these buckets are per-IP and an office behind one NAT shares one: five registrations per five
  # minutes is right for the open internet and wrong for a customer onboarding a team, and the only
  # remedy was a redeploy. And the e2e suite could not run at all -- it registers an account per test
  # for isolation and stages a statement in most of them, so it tripped register at test six and
  # import-stage at test eleven, every run, regardless of whether the product worked.
  #
  # Raise these ONLY for a test stack. They are the app's defence against credential stuffing, spam
  # registration, email enumeration, and unbounded growth of import_sessions.
  rate-limit:
    login:
      max: ${RATE_LIMIT_LOGIN_MAX:10}
      window-seconds: ${RATE_LIMIT_LOGIN_WINDOW_SECONDS:60}
    register:
      max: ${RATE_LIMIT_REGISTER_MAX:5}
      window-seconds: ${RATE_LIMIT_REGISTER_WINDOW_SECONDS:300}
    forgot-password:
      max: ${RATE_LIMIT_FORGOT_PASSWORD_MAX:5}
      window-seconds: ${RATE_LIMIT_FORGOT_PASSWORD_WINDOW_SECONDS:300}
    import-stage:
      max: ${RATE_LIMIT_IMPORT_STAGE_MAX:10}
      window-seconds: ${RATE_LIMIT_IMPORT_STAGE_WINDOW_SECONDS:600}
    password-change:
      max: ${RATE_LIMIT_PASSWORD_CHANGE_MAX:15}
      window-seconds: ${RATE_LIMIT_PASSWORD_CHANGE_WINDOW_SECONDS:600}
    reset-password:
      max: ${RATE_LIMIT_RESET_PASSWORD_MAX:10}
      window-seconds: ${RATE_LIMIT_RESET_PASSWORD_WINDOW_SECONDS:600}
  import:
    # See ImportConcurrencyLimiter's own doc comment for the full reasoning. 6 is deliberately
    # conservative relative to DB_POOL_MAX_SIZE (10, see the datasource config above) -- leaves
    # headroom for every OTHER endpoint's own database usage to keep working normally even while
    # imports are maxed out, rather than statement imports alone being able to starve the whole
    # connection pool.
    max-concurrent: ${IMPORT_MAX_CONCURRENT:6}
    # How long an import request waits in the FIFO queue for a processing slot before giving up
    # and returning a clear "try again shortly" response, rather than hanging indefinitely.
    acquire-timeout-ms: ${IMPORT_ACQUIRE_TIMEOUT_MS:20000}
  statement-storage:
    # Phase 2 of docs/engineering/statement-storage-migration.md. The V54 content_hash/object_key
    # columns exist and the import pipeline IS wired to this layer -- ImportService,
    # ImportSessionService and StatementImportService all read and write statement bytes through
    # StatementContentService now.
    #
    # It is still inert until a provider is named, but that is now the property below doing the
    # work rather than the callers being unwired: with provider unset there is no StatementStorage
    # bean, StatementContentService.store() returns empty, and statements stay as BYTEA on
    # statement_imports/import_sessions exactly as before.
    #
    # This is a DUAL WRITE: with a provider set, a new upload writes its bytes to object storage
    # AND still fills file_content, so turning the provider back off is a config rollback rather
    # than a deploy. Every read re-derives the SHA-256 and compares it against the row's recorded
    # hash (ContentAddress.requireMatches, called from StatementContentService).
    #
    # There is no backfill, and deliberately so: the migration/backfill phase was removed once it
    # was established there is no historical statement content to migrate. New uploads are
    # addressed from the moment they arrive.
    #
    # file_content stays until the r2 provider exists. It is not redundancy for its own sake --
    # Railway's container filesystem is EPHEMERAL, so with provider=filesystem the BYTEA column is
    # the only durable copy, and dropping it before a durable provider is configured would lose
    # every statement on each deploy.
    #
    # Deliberately has no default: no bean is created unless a provider is named, so an unset value
    # preserves today's behaviour rather than silently activating a store nobody asked for. A value
    # that IS set but matches no implementation is rejected at startup rather than silently
    # behaving like "unset" -- see StatementContentService's constructor.
    # "filesystem" is for local development and tests; "r2" is Cloudflare R2, for production.
    provider: ${STATEMENT_STORAGE_PROVIDER:}
    filesystem:
      # Only read when provider=filesystem. Single-instance only -- two backends would each see
      # their own disk. See FilesystemStatementStorage's own doc comment.
      root: ${STATEMENT_STORAGE_FS_ROOT:./data/statements}
    r2:
      # Only read when provider=r2, and every one of them is then REQUIRED: R2StatementStorage
      # refuses to construct with any of them blank, so the application fails at startup rather
      # than accepting uploads it has nowhere durable to put.
      #
      # The two keys come from an R2 API token (Cloudflare dashboard, R2 > Manage API Tokens) and
      # belong in Railway's environment variables. They must never be committed, and there is
      # deliberately no default here that would let a blank value look configured.
      account-id: ${R2_ACCOUNT_ID:}
      bucket: ${R2_BUCKET:}
      access-key-id: ${R2_ACCESS_KEY_ID:}
      secret-access-key: ${R2_SECRET_ACCESS_KEY:}
      # OPTIONAL, and normally left unset -- the endpoint is derived from account-id as
      # https://<account-id>.r2.cloudflarestorage.com, which is correct for an ordinary bucket.
      #
      # Set it only when derivation is wrong: a bucket created with a JURISDICTION restriction
      # lives at <account-id>.eu.r2.cloudflarestorage.com (or .fedramp.), and the derived URL would
      # point at a bucket that does not exist -- which R2 reports as an auth failure, not as a
      # missing bucket, so it reads like the credentials are wrong.
      #
      # This is the "S3 API" URL shown on the R2 dashboard. It is validated at startup (absolute,
      # https, has a host) rather than passed through, because a typo here would otherwise surface
      # as a connection error at the first upload with nothing naming the variable.
      endpoint: ${R2_ENDPOINT:}

# Backend error monitoring. Off unless SENTRY_DSN is set -- the same posture as every other
# external integration here (RESEND_API_KEY, GOOGLE_APPLICATION_CREDENTIALS). See
# com.finora.observability.MonitoringConfig for why each option below is stated rather than
# inherited, and SentryScrubber for what is stripped before anything is transmitted.
sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:development}
  # Set by the deploy to the commit SHA, so an error points at a deploy rather than at "production".
  release: ${SENTRY_RELEASE:}
  # The starter would otherwise install a logback appender that ships every ERROR log as an event,
  # in addition to the exceptions we capture deliberately. On this backend a log line is the single
  # most likely place for a narration or an amount to appear, so that channel stays closed and
  # reporting stays explicit.
  logging:
    enabled: false
  # Belt to MonitoringConfig's braces: the starter reads this key directly, so setting it here means
  # PII stays off even if the options bean is ever removed or reordered.
  send-default-pii: false

management:
  endpoints:
    web:
      # prometheus joins health so worker metrics can be scraped. Note what is NOT here: env,
      # configprops, heapdump, threaddump, loggers, beans. The scrape endpoint publishes counters,
      # timers and gauges -- names and numbers, no request data and no customer data -- which is a
      # different risk class from the endpoints that dump configuration or memory.
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never   # never leak DB/disk details on a publicly-reachable health endpoint
  metrics:
    tags:
      # Stamped on every meter so one Prometheus can hold more than one environment without the
      # series colliding. Matches sentry.environment deliberately: an alert and an error should
      # agree about which deployment they came from.
      environment: ${SENTRY_ENVIRONMENT:development}
  prometheus:
    metrics:
      export:
        enabled: true

# /actuator/prometheus is NOT publicly reachable, and that is already handled: SecurityConfig
# permits /actuator/health and nothing else, so the scrape requires a token. Right posture -- the
# scrape carries queue depths, error rates and JVM internals, which is useful reconnaissance even
# though it holds no customer data. WorkerMetricsExportIT asserts both halves: anonymous access
# fails, authenticated access returns the meters.
#
# The consequence, and the remaining deployment decision: a scraper needs either a credential or a
# private network path to Railway. Resolving that by adding /actuator/** to permitAll would make
# Prometheus work and publish the same data to the internet in one move -- which is exactly why the
# IT asserts the anonymous case. See docs/engineering/observability.md, "Known gaps".

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  pattern:
    # [%X{requestId}] pulls the correlation ID that CorrelationIdFilter puts into MDC â€”
    # every log line for a given request carries the same ID, so grepping one ID out of
    # a log file gives you that request's entire story, not just the line that errored.
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%X{requestId:-no-request-id}] %logger{36} - %msg%n"
