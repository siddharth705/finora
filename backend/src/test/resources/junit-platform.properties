# Class-level parallel execution, scoped deliberately.
#
# WHY THREAD-level (JUnit 5's own executor), NOT PROCESS-level (Surefire forkCount/parallel):
# AbstractIntegrationTest holds its shared Postgres Testcontainer and Spring's own context cache
# as JVM-static state, started once and reused across every *IT class in the run -- see that
# class's own doc comment for the bug this fixed (a container that used to restart per test
# class). Surefire fork-based parallelism runs each fork as a SEPARATE JVM, which would multiply
# that container instead of sharing it. JUnit 5's own thread-level parallel executor runs
# everything in the ONE JVM Surefire already starts, so the existing container-reuse design stays
# intact -- this file only changes how many threads pull work from that single JVM's test queue.
#
# WHY "classes.default=concurrent" is safe for the ~217 pure-unit *Test.java classes: none of
# them load a Spring context (confirmed -- only AbstractIntegrationTest itself, among *Test.java-
# named files, carries @SpringBootTest) and each gets its own fresh mocks per class, so there is
# no shared mutable state between them to race on.
#
# WHY "methods.default=same_thread" (methods within one class stay sequential): the ~217 unit
# classes were never written expecting their own @Test methods to run concurrently against each
# other (shared instance fields set up in @BeforeEach are common and are not designed to be
# thread-safe within a class) -- parallelizing across classes captures the large, safe win without
# also requiring an audit of every class's internal state for intra-class thread-safety.
#
# WHY THE ~90 *IT CLASSES DO NOT GET CONCURRENT EXECUTION HERE: all of them extend
# AbstractIntegrationTest, which shares one cached Spring ApplicationContext (and its singleton
# beans) across every IT class with matching configuration -- confirmed, not assumed:
# RateLimiter is exactly this shape (a stateful, IP-keyed singleton), and a real cross-test
# interaction through it was diagnosed and fixed the same day this file was added (a shared
# rate-limiter budget being drawn down by unrelated IT classes in the same run). Running IT
# classes concurrently would multiply that exposure across every other stateful singleton bean in
# the app, none of which have been individually audited for concurrent-test-time safety. Handled
# by marking AbstractIntegrationTest itself @org.junit.jupiter.api.parallel.Isolated (see that
# class) -- every subclass inherits it, so the whole *IT population runs exactly as serially as it
# does today, interleaved with (not blocked by) the unit tests running in parallel around it.
junit.jupiter.execution.parallel.enabled = true
junit.jupiter.execution.parallel.mode.default = same_thread
junit.jupiter.execution.parallel.mode.classes.default = concurrent

# Dynamic: thread count scales with available processors rather than a hardcoded number, so this
# behaves reasonably on both a laptop and whatever CI runner size is in use without needing a
# separate CI-specific override.
junit.jupiter.execution.parallel.config.strategy = dynamic
junit.jupiter.execution.parallel.config.dynamic.factor = 1.0
