# D-4: fronts the scaled `backend` service so a host-side load generator sees one address
# regardless of replica count. Deliberately plain round-robin (nginx's default, no sticky
# session/ip_hash directive) -- that's the honest worst case for RateLimiter/
# ImportConcurrencyLimiter, both scoped per-JVM-instance: a real deployment behind Railway's own
# edge proxy would round-robin the same way, with no session affinity guaranteed either.
#
# Resolves `backend` via Docker's embedded DNS, which returns one A record per replica and
# round-robins across them on each new connection -- this is what actually distributes requests
# across backend-1/backend-2 without hand-listing container names anywhere in this file, so the
# same config works unchanged whether backend is scaled to 1 (baseline) or 2 (the experiment).
events {}

http {
    resolver 127.0.0.11 valid=5s;

    server {
        listen 80;

        location / {
            set $upstream http://backend:8080;
            proxy_pass $upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_http_version 1.1;
        }
    }
}
